<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}EcoShare - Community Resource & Waste Exchange{% endblock %}</title>
    <!-- Google Fonts & Tailwind CDN for responsive modern styling -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#ecfdf5',
                            100: '#d1fae5',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857',
                            900: '#064e3b',
                        },
                        earth: {
                            500: '#f59e0b',
                            600: '#d97706',
                        }
                    },
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col font-sans antialiased">
    <!-- Navbar -->
    <header class="bg-white/95 backdrop-blur-md border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between h-16">
            <a href="/" class="flex items-center gap-3 group">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-emerald-400 flex items-center justify-center text-white text-xl shadow-md group-hover:scale-105 transition-transform">
                    🌱
                </div>
                <div>
                    <span class="text-xl font-extrabold tracking-tight text-slate-900 group-hover:text-brand-600 transition-colors">EcoShare</span>
                    <span class="text-xs block text-slate-500 font-medium -mt-1">SDG 11 & 12 • Campus & Community</span>
                </div>
            </a>
            
            <nav class="hidden md:flex items-center gap-6 text-sm font-semibold text-slate-600">
                <a href="/" class="hover:text-brand-600 transition-colors">Marketplace</a>
                <a href="/list-item" class="hover:text-brand-600 transition-colors">List Resource</a>
                <a href="/exchanges" class="hover:text-brand-600 transition-colors">Exchanges</a>
                <a href="/impact" class="hover:text-brand-600 transition-colors">SDG Impact</a>
                <a href="/viva-doc" class="text-emerald-700 bg-emerald-50 px-3 py-1.5 rounded-lg border border-emerald-200 hover:bg-emerald-100 transition-colors">OOP Architecture & Viva</a>
            </nav>

            <div class="flex items-center gap-3">
                <a href="/list-item" class="bg-brand-600 hover:bg-brand-700 text-white font-semibold text-sm px-4 py-2 rounded-xl shadow-sm hover:shadow transition-all flex items-center gap-1.5">
                    <span>+</span> Share Item
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content Block -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 mt-auto py-8">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col md:flex-row items-center justify-between gap-4 text-xs text-slate-500">
            <div class="flex items-center gap-2">
                <span class="font-bold text-slate-700">EcoShare</span> — Object-Oriented Software Engineering Lab Project
            </div>
            <div class="flex items-center gap-4">
                <span class="bg-emerald-50 text-emerald-700 font-semibold px-2.5 py-1 rounded-md border border-emerald-200">SDG 11: Sustainable Cities</span>
                <span class="bg-amber-50 text-amber-700 font-semibold px-2.5 py-1 rounded-md border border-amber-200">SDG 12: Responsible Consumption</span>
            </div>
        </div>
    </footer>
</body>
</html>
